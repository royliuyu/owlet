# Default config committed to the repo. Local overrides go in config/local.yaml (not committed).
# Relative paths resolve from the repo root, not from the process working directory.
#
# Only startup settings belong here. Which folders to read is user data, stored in
# the sources table of <data_dir>/metadata.db and added or removed on the Settings page.

data_dir: data
auth_token: ""
host: 127.0.0.1
port: 8000

# Google sign-in. client id may be empty; the secret comes from OWLET_GOOGLE__CLIENT_SECRET.
# redirect_origins is a comma-separated list of extra origins (a future cloud https host).
# Local http://127.0.0.1:<port> and http://localhost:<port> are always allowed, so they do not belong here.
google:
  client_id: ""
  client_secret: ""
  redirect_origins: ""
